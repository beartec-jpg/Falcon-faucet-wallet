[package]
name = "falcon-sign"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Falcon-512 keys, signing and tx building for the Falcon PL (FPL) testnet"
repository = "https://github.com/beartec-uk/Falcon-faucet-wallet"

[workspace]

[dependencies]
pqcrypto-falcon = "0.3"
pqcrypto-traits = "0.3"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
